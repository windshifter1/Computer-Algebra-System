<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algebra</title>
    <meta name="description" content="Computer algebra system with split tab panes and floating windows.">
    <link rel="canonical" href="./">
    <link rel="stylesheet" href="./windows.css">
</head>
<body>
    <div id="wm-app">
        <div id="wm-stage">
            <div id="wm-dock"></div>
            <div id="wm-popups"></div>
            <div id="wm-drop-catcher"></div>
            <div id="wm-dock-preview" aria-hidden="true">
                <div class="wm-preview-zone" data-zone="left">
                    <span class="wm-preview-label">Split left</span>
                </div>
                <div class="wm-preview-zone" data-zone="right">
                    <span class="wm-preview-label">Split right</span>
                </div>
                <div class="wm-preview-zone" data-zone="top">
                    <span class="wm-preview-label">Split top</span>
                </div>
                <div class="wm-preview-zone" data-zone="bottom">
                    <span class="wm-preview-label">Split bottom</span>
                </div>
                <div class="wm-preview-zone" data-zone="center">
                    <span class="wm-preview-label">Float as popup</span>
                </div>
                <div class="wm-preview-zone" data-zone="pane">
                    <span class="wm-preview-label">Move to this pane</span>
                </div>
            </div>
            <div id="wm-pool" hidden></div>
        </div>
    </div>
    <div id="wm-drag-ghost" aria-hidden="true"></div>
    <script src="./windows.js"></script>
</body>
</html>
