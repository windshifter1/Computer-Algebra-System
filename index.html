<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algebra</title>
    <meta name="description" content="Computer algebra system with split tab panes and floating windows.">
    <link rel="canonical" href="./">
    <link rel="stylesheet" href="./windows.css?v=7">
</head>
<body>
    <div id="wm-app">
        <div id="wm-stage">
            <div id="wm-windows"></div>
            <div id="wm-pct-overlay" aria-hidden="true">
                <svg id="wm-x-split" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
                <div id="wm-x-labels"></div>
                <div id="wm-pct-snap" hidden></div>
            </div>
            <div id="wm-drop-catcher"></div>
            <div id="wm-pct-hud">
                <span id="wm-pct-hud-text">X-split</span>
                <button type="button" id="wm-pct-toggle" title="Toggle X-split overlay">Map</button>
            </div>
        </div>
    </div>
    <div id="wm-drag-ghost" aria-hidden="true"></div>
    <script src="./windows.js?v=7"></script>
</body>
</html>
